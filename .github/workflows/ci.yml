name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Types, unit tests, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck both apps
        run: npm run typecheck:apps
      - name: Build the Cloud Functions
        run: npm run functions:build
      - name: Build the clinic and patient apps
        run: |
          npm run build --workspace @parcha/clinic
          npm run build --workspace @parcha/patient

  integration:
    name: Rules and functions against the emulators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run functions:build
      - run: npm install -g firebase-tools
      - name: Emulators, seed, then the tests
        env:
          FUNCTIONS_EMULATOR_TIMEOUT_SECONDS: "300"
        run: >
          firebase emulators:exec --only auth,firestore,functions --project parcha-dev
          "npm run test:integration"
