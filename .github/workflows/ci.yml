name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck both apps
        run: npm run typecheck:apps
      - name: Build the Cloud Functions
        run: npm run functions:build
